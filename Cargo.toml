[package]
name = "tess"
version = "0.1.0"
edition = "2021"
description = "A less-style terminal pager."

[dependencies]
crossterm = { version = "0.27", features = ["use-dev-tty"] }
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
unicode-segmentation = "1"
unicode-width = "0.1"
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lib]
name = "tess"
path = "src/lib.rs"

[[bin]]
name = "tess"
path = "src/main.rs"
