[package]
name = "tess"
version = "0.6.3"
edition = "2021"
description = "A less-style terminal pager."

[dependencies]
crossterm = { version = "0.27", features = ["use-dev-tty"] }
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
unicode-segmentation = "1"
unicode-width = "0.1"
signal-hook = "0.3"
libc = "0.2"
regex = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
quick-xml = { version = "0.36", features = ["serialize"] }
csv = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "tess"
path = "src/lib.rs"

[[bin]]
name = "tess"
path = "src/main.rs"
